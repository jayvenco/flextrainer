name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # One plain image manifest (no attestation index): that is what Unraid compares to detect updates.
          provenance: false
          sbom: false
          tags: |
            ghcr.io/jayvenco/flextrainer:latest
            ghcr.io/jayvenco/flextrainer:${{ github.sha }}
