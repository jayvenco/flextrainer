name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: python -m pytest -q

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the container
        run: |
          docker build -t flextrainer:ci .
          docker run -d --name ft -p 8888:8000 flextrainer:ci
      - name: Health is green
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8888/health && curl -fsS http://localhost:8888/ready && exit 0
            sleep 2
          done
          docker logs ft; exit 1
      - name: Login works and forces a password change
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -d 'username=admin&password=admin' http://localhost:8888/login)
          echo "$code"
          echo "$code" | grep -q '^303 .*/account/password'
